<form method="post" action="/">
    <h1>
        {locale group="quiqqer/payments-gateway" var="server.order"}
        #{$Order->getId()|escape:'html'}
    </h1>

    <section aria-labelledby="example-gateway-articles-title">
        <h2 id="example-gateway-articles-title">
            {locale group="quiqqer/payments-gateway" var="server.articles"}
        </h2>

        {* ArticleList::toHTML() is the established QUIQQER article renderer. *}
        {$Articles->toHTML()}
    </section>

    <div>
        <button type="submit" name="submit" value="PAY">
            {locale group="quiqqer/payments-gateway" var="server.pay"}
        </button>
        <button type="submit" name="submit" value="CANCEL">
            {locale group="quiqqer/payments-gateway" var="server.cancel"}
        </button>
    </div>

    <input type="hidden" name="orderHash" value="{$Order->getHash()|escape:'html'}">
    <input type="hidden" name="PAYMENT_TEST_GATEWAY" value="1">
</form>
